<title>GoldTriEngine Admin</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242d;--line:#2a323d;--text:#e6e9ee;--mute:#8b95a3;--gold:#e0b24a;--gold2:#f5d27a;--ok:#3fb27f;--bad:#e5534b;--warn:#e0a03a;--info:#4f8ff7}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}

nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{color:var(--text);background:var(--panel);border-color:var(--line)}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:6px}
main{padding:16px;max-width:1280px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px}
button.b{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.b:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button.dng{border-color:var(--bad);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse}
.tblw{overflow-x:auto}
.tbl th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.p-ok{color:var(--ok);border-color:var(--ok)}.p-bad{color:var(--bad);border-color:var(--bad)}.p-warn{color:var(--warn);border-color:var(--warn)}.p-info{color:var(--info);border-color:var(--info)}.p-mute{color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace}
.mute{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.kx{position:relative;overflow:hidden;transition:transform .2s,border-color .2s}.kx:hover{transform:translateY(-3px);border-color:var(--gold)}.kpi.kx b{font-size:30px}.hot{box-shadow:0 0 0 0 rgba(224,160,58,.5);animation:hotp 2.2s infinite}@keyframes hotp{70%{box-shadow:0 0 0 10px rgba(224,160,58,0)}100%{box-shadow:0 0 0 0 rgba(224,160,58,0)}}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:8px}.spark i{flex:1;background:linear-gradient(var(--gold2),var(--gold));border-radius:2px 2px 0 0;opacity:.85;transform-origin:bottom;animation:sg .6s both}@keyframes sg{from{transform:scaleY(0)}}
.fn{display:grid;gap:8px}.fr{display:grid;grid-template-columns:150px 1fr 48px 44px;gap:10px;align-items:center;font-size:13px}.ft{height:14px;background:var(--panel2);border-radius:8px;overflow:hidden}.ft i{display:block;height:100%;width:0;min-width:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));border-radius:8px;animation:fw 1.1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fw{to{width:var(--w)}}.fr em{font-style:normal;color:var(--mute);text-align:right}.fr b{text-align:right}
.gts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}.gt{position:relative;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 16px;color:var(--text);cursor:pointer;transition:transform .18s,border-color .18s,background .18s}.gt:hover{transform:translateY(-3px);border-color:var(--c)}.gt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}.gt b{display:block;font-size:26px;color:var(--c)}.gt span{font-size:12px;color:var(--mute)}.gt u{position:absolute;left:0;bottom:0;height:3px;width:var(--p);background:var(--c);transition:width .8s}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:8px;font-size:12px;font-weight:700;color:#0e1116;background:var(--c);vertical-align:middle}.tbl tr[data-u]{transition:background .15s}.tbl tr[data-u]:hover{background:var(--panel2)}
@media (max-width:600px){.fr{grid-template-columns:100px 1fr 36px 38px}}
@media (prefers-reduced-motion:reduce){.hot,.spark i,.ft i{animation:none}.ft i{width:var(--w)}}
#view.enter{animation:vin .45s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.card>b:first-child{display:inline-block;padding-left:10px;border-left:3px solid var(--gold);margin-bottom:6px}

.mb{display:flex;align-items:flex-end;gap:12px;height:150px}.mb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}.mb i{display:block;width:100%;max-width:56px;height:var(--h);background:linear-gradient(var(--gold2),var(--gold));border-radius:6px 6px 0 0;transform-origin:bottom;animation:sg .7s both}.mb b{font-size:11px}.mb small{color:var(--mute);font-size:11px}
.ring{display:flex;align-items:center;gap:22px;flex-wrap:wrap}@keyframes rg{to{stroke-dashoffset:var(--to)}}
.th{width:104px;height:58px;object-fit:cover;border-radius:8px;display:block;transition:transform .2s}.th:hover{transform:scale(1.06)}
.tl{margin-top:12px;padding-left:6px}.te{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);animation:vin .4s both}.te u{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.card{transition:border-color .2s}.card:hover{border-color:#3a4553}#tabs button{transition:transform .15s,background .15s}#tabs button:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){#view.enter,.sg i,.mb i,.te{animation:none}.sg i{width:var(--w)}}
.sw{position:relative;display:inline-block;width:42px;height:24px}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.25s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#8b95a3;transition:.25s}.sw input:checked+i{background:rgba(63,178,127,.25);border-color:var(--ok)}.sw input:checked+i::after{left:21px;background:var(--ok)}
.auto.live{border-color:var(--ok);box-shadow:0 0 0 0 rgba(63,178,127,.4);animation:hotp2 3s infinite}@keyframes hotp2{70%{box-shadow:0 0 0 10px rgba(63,178,127,0)}100%{box-shadow:0 0 0 0 rgba(63,178,127,0)}}
.seqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.seq{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--panel2)}.seq>b{display:block;margin-bottom:6px;color:var(--c);font-size:13px}.sq{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.sq u{flex:none;width:20px;height:20px;border-radius:50%;background:var(--c);color:#0e1116;display:grid;place-items:center;font-size:11px;font-weight:700;text-decoration:none}.sq small{display:block;color:var(--mute);font-size:11px}

/* ===== skin: Aurora. Deep ink, violet, magenta and cyan glass with moving light (day = pearl and indigo) ===== */
:root{--bg:#06061a;--panel:rgba(24,21,58,.7);--panel2:rgba(46,40,98,.5);--panel-s:#0e0c2b;--line:rgba(170,160,255,.17);--text:#F0F1FF;--mute:#9EA0CC;--gold:#A78BFA;--gold2:#5EE3F5;--ok:#2DE2A6;--bad:#FF6B8B;--warn:#FFB454;--info:#5CC8FF;--brand:linear-gradient(115deg,#7c3aed 0%,#c026d3 52%,#0ea5e9 100%);--glow:rgba(167,139,250,.5);--glow2:rgba(45,226,166,.25);--fxa:rgba(124,58,237,.42);--fxb:rgba(14,165,233,.3);--fxc:rgba(217,70,239,.26);--grid:rgba(170,160,255,.05);--shadow:0 22px 50px -22px rgba(2,0,30,.9);--k1:#a78bfa;--k2:#22d3ee;--k3:#f472b6;--k4:#fbbf24;color-scheme:dark}

:root[data-theme="light"]{--bg:#eef0ff;--panel:rgba(255,255,255,.78);--panel2:rgba(236,238,255,.9);--panel-s:#fff;--line:rgba(88,76,210,.17);--text:#14143a;--mute:#585b8c;--gold:#6d3df0;--gold2:#0c8aa8;--ok:#058a5e;--bad:#d6224f;--warn:#b45f06;--info:#2563eb;--glow:rgba(109,61,240,.32);--glow2:rgba(5,138,94,.2);--fxa:rgba(139,92,246,.34);--fxb:rgba(56,189,248,.3);--fxc:rgba(244,114,182,.26);--grid:rgba(88,76,210,.07);--shadow:0 22px 46px -22px rgba(76,58,190,.35);--k1:#6d3df0;--k2:#0ea5c6;--k3:#db2777;--k4:#d97706;color-scheme:light}

async function start() {
  if (DEMO) { sb = demoClient(); return enter(); }
  sb = supabase.createClient(SB_URL, SB_KEY, {auth: {detectSessionInUrl: true, persistSession: true}});
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hide'); return; }
  await mfaGate();
}
async function mfaGate() {
  $('#login').classList.remove('hide'); $('#stepEmail').classList.add('hide'); $('#stepMfa').classList.remove('hide'); $('#app').classList.add('hide');
  const {data: g, error} = await sb.rpc('admin_gate');
  if (error) return say('#loginMsg', error.message, true);
  if (g && g.verified) return enter();
  if (!g || !g.flag) return say('#loginMsg', 'This account is not an admin. Sign out and use the admin account.', true);
}
$('#sendLink').onclick = async () => {
  const email = $('#email').value.trim(); if (!email) return;
  const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin + location.pathname}});
  say('#loginMsg', error ? error.message : 'Check your email and open the link on this device.', !!error);
};
$('#gLogin').onclick = async () => {
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  if (error) say('#loginMsg', error.message, true);
};
$('#sendTg').onclick = async () => {
  const {error} = await sb.rpc('admin_otp_request');
  say('#loginMsg', error ? error.message : 'Code sent. Open Telegram and type the 6 digits here.', !!error);
};

  const {data: ok, error} = await sb.rpc('admin_otp_verify', {p_code: $('#code').value.trim()});
  if (error) return say('#loginMsg', error.message, true);
  if (!ok) return say('#loginMsg', 'Wrong code. Try again, or ask for a new one.', true);
  enter();
};

function say(sel, text, err) { $(sel).innerHTML = '<div class="msg ' + (err ? 'err' : 'okk') + '">' + esc(text) + '</div>'; }

async function call(fn, args) {
  const {data: d, error} = await sb.rpc(fn, args || {});
  if (error) { toast(error.message, true); throw error; }
  return d;
}
function toast(text, err) { const t = document.createElement('div'); t.className = 'msg ' + (err ? 'err' : 'okk'); t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;min-width:240px'; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
async function load() {
  const [licenses, orders, customers, config, audit] = await Promise.all(['admin_licenses', 'admin_orders', 'admin_customers', 'admin_config', 'admin_audit'].map(f => call(f)));
  Object.assign(data, {licenses, orders, customers, config, audit});
  const p = await sb.from('plans').select('*').order('sort'); data.plans = p.data || [];
  const v = await sb.from('videos').select('*').order('sort'); data.videos = (v && v.data) || [];
}

  <div class="card sp-thread">${cur ? `<div class="row"><b>${esc(cur.subject)}</b><span class="sp" style="flex:1"></span>${pill(cur.status)}</div>
    <div class="mute" style="font-size:12px;margin-bottom:10px">${esc(cur.full_name || '')} ${esc(cur.email || '')} · ${cur.guest ? '<span class="pill p-info">no account</span>' : cur.active_licenses + ' active license(s)'}${cur.topic ? ' · <span class="pill p-mute">' + esc({license: 'license', order: 'order', ea: 'EA problem', before: 'before buying', other: 'other'}[cur.topic] || cur.topic) + '</span>' : ''}${cur.mt5_account ? ' · MT5 <span class="mono">' + esc(cur.mt5_account) + '</span>' : ''} · reference T-${cur.id} · opened ${esc(fmt(cur.created_at))}</div>
    <div class="sp-msgs">${cur.messages.map(m => `<div class="sp-m ${m.from_admin ? 'me' : ''}"><div class="mute" style="font-size:11px">${m.from_admin ? 'You' : 'Customer'} · ${esc(fmt(m.at))}</div><div>${esc(m.body)}</div></div>`).join('')}</div>
    ${cur.status === 'closed' ? '<div class="row" style="margin-top:10px"><button class="b" id="sp_open">Reopen</button></div>' : `<textarea id="sp_body" rows="4" maxlength="4000" placeholder="Write your answer. It is emailed to the customer, and shown in My requests if they have an account." style="width:100%;margin-top:10px"></textarea>

  $('#spf').onchange = e => { window._spf = e.target.value; window._spt = null; vSupport(); };
  $('#view').querySelectorAll('[data-t]').forEach(d => { if (d.classList.contains('sp-item')) d.onclick = () => { window._spt = +d.dataset.t; vSupport(); }; });
  const act = async fn => { try { await fn(); await load(); vSupport(); } catch (e) { toast(e.message || String(e), true); } };
  $('#view').querySelectorAll('[data-cn]').forEach(b => b.onclick = () => { const ta = $('#sp_body'); ta.value = (ta.value ? ta.value + '\n\n' : '') + CANNED[+b.dataset.cn][1]; ta.focus(); });
  const send = close => act(async () => {
    await call('admin_support_reply', {p_ticket: cur.id, p_body: $('#sp_body').value, p_close: close});
    const m = await sendMailKind({kind: 'support_reply', ticket_id: cur.id});
    toast((close ? 'Answered and closed. ' : 'Answer saved. ') + (m.ok ? 'Emailed to ' + m.to + '.' : 'Email NOT sent: ' + m.error), !m.ok);
  });
  if ($('#sp_send')) { $('#sp_send').onclick = () => send(false); $('#sp_close').onclick = () => send(true); $('#sp_shut').onclick = () => act(async () => { await call('admin_support_status', {p_ticket: cur.id, p_status: 'closed'}); toast('Closed'); }); }
  if ($('#sp_open')) $('#sp_open').onclick = () => act(async () => { await call('admin_support_status', {p_ticket: cur.id, p_status: 'open'}); toast('Reopened'); });
}

async function vEmail() {

  const room = Math.max(0, B.cap - B.sent_24h), preview = txt => esc(txt || '').split(/\n{2,}/).map(p => '<p style="margin:0 0 10px">' + p.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<u>$1</u>').replace(/\n/g, '<br>') + '</p>').join('');

  <div class="card"><b>Start from a ready-made email</b> <span class="mute">pick one, check the text, change what you like, then send yourself a test</span>
    <div class="em-tpl">

    <details style="margin-top:12px"><summary class="mute" style="cursor:pointer">Why send emails at all, and how often?</summary>
      <div class="mute" style="margin-top:8px;font-size:13px;line-height:1.6">
        <b>The digest</b> brings readers back to the blog, which keeps them close to the product and sends the search engines a steady stream of real visits. <b>A spotlight</b> pushes one useful lesson to people who missed it. <b>A new version note</b> tells owners and future buyers that the EA is maintained. <b>A discount code</b> is for launches only; sent too often it teaches people to wait. <b>A news reminder</b> is the most useful one for gold traders: it tells them when to be careful. <b>The feedback email</b> gives you topics straight from readers.<br>
        A good rhythm is <b>one email a week</b>, never more than two. Every email says what it is, links to something useful and carries a one-click unsubscribe link automatically. None of these contains a trade signal or a promise of profit.</div></details></div>
  <div class="card"><div class="row"><b>Draft with the local AI</b><span class="sp" style="flex:1"></span><span class="pill p-info">needs your PC on</span></div>
    <span class="mute">Say in a sentence what the email is about. The AI on your PC writes a short draft; it fills the editor below and you decide what to keep. It never sends anything. Your PC also prepares a weekly digest every Friday and a heads-up before major news days; they appear here too.</span>
    <textarea id="dr_t" rows="2" maxlength="600" style="width:100%;margin-top:8px" placeholder="Example: Remind subscribers that the jobs report is on Friday and that we have a lesson explaining it"></textarea>
    <div class="row" style="margin-top:8px"><button class="b pri" id="dr_go">Ask the local AI</button><span class="mute" style="font-size:12px">Ready within about 15 minutes (the PC checks in every 15 minutes). A draft that is not safe is skipped, with the reason.</span></div>
    <div id="dr_list" style="margin-top:10px"></div></div>
  <div class="card"><b>Write an email</b> <span class="mute">to everyone subscribed to the blog emails. Each email carries a one-click unsubscribe link automatically.</span>
    <label>Subject</label><input id="em_s" maxlength="150" style="width:100%" placeholder="This week in gold">
    <label>Message</label><textarea id="em_b" rows="10" maxlength="20000" style="width:100%" placeholder="Hello,&#10;&#10;Write in short paragraphs. A blank line starts a new paragraph.&#10;&#10;Add a link like this: [Read the post](https://goldtriengine.com/blog/)"></textarea>
    <div class="mute" style="font-size:12px;margin-top:4px">A blank line = new paragraph. Links: [words](https://...). Do not promise profits; trading involves risk.</div>
    <div class="mute" style="margin:10px 0 4px;font-size:12px">Preview of the text</div><div id="em_p" class="em-prev mute">Your message appears here.</div>
    <div class="row" style="margin-top:12px"><button class="b" id="em_test">Send a test to me</button><button class="b pri" id="em_go" ${B.subscribers ? '' : 'disabled'}>Send to ${B.subscribers} subscriber(s)</button></div>
    <div id="em_prog" style="display:none;margin-top:12px"><div class="sg"><i id="em_bar" style="--c:var(--ok);--w:0%;animation:none;width:0"></i></div><div class="mute" id="em_txt" style="margin-top:6px"></div></div></div>
  <div class="card"><b>Sent emails</b> ${B.history.length ? `<div class="tblw"><table class="tbl"><tr><th>Date</th><th>Subject</th><th>Delivered</th><th>Failed</th><th>Waiting</th></tr>${B.history.map(h => `<tr><td class="mono">${esc(fmt(h.created_at))}</td><td>${esc(h.subject)}</td><td><b>${h.sent}</b> of ${h.total}</td><td>${Number(h.failed) ? '<span style="color:var(--bad)">' + h.failed + '</span>' : '-'}</td><td>${Number(h.waiting) ? h.waiting : '-'}</td></tr>`).join('')}</table></div>` : '<p class="mute">Nothing sent yet.</p>'}
    <p class="mute" style="font-size:12px;margin:8px 0 0">Gmail allows roughly 500 emails a day, so the limit is ${B.cap} a day. Large lists are sent in small batches; keep this page open until it finishes.</p></div>`;
  const upd = () => { $('#em_p').innerHTML = preview($('#em_b').value); }; $('#em_b').oninput = upd; upd();
  const todayUtc = new Date().toISOString().slice(0, 10), weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10), SITE = 'https://goldtriengine.com';
  const live = posts.filter(p => p.status === 'published' && p.post_date <= todayUtc && p.kind !== 'page').sort((a, b) => (a.post_date < b.post_date ? 1 : -1));
  const LBL = {lesson: 'Lesson', weekly: 'Weekly review', story: 'On this day', brief: 'Outlook', recap: 'Day recap', researched: 'Lesson'};
  const closing = '\n\nTrading involves risk and nothing here is financial advice.\n\nYelias\nGoldTriEngine';
  const fill = (subject, body) => { $('#em_s').value = subject; $('#em_b').value = body; upd(); $('#em_s').scrollIntoView({behavior: 'smooth', block: 'center'}); toast('Template loaded. Check the text, then send yourself a test.'); };
  const tpl = {
    digest() {
      const items = live.filter(p => p.post_date >= weekAgo && ['lesson', 'weekly', 'story', 'researched'].includes(p.kind)).slice(0, 5), brief = live.find(p => p.kind === 'brief');
      if (!items.length && !brief) return toast('No post was published in the last 7 days to put in a digest', true);
      const lines = items.map(p => `[${p.title}](${p.url})\n${LBL[p.kind] || 'Post'}, ${p.post_date}`).join('\n\n');
      fill(items[0] ? `This week in gold: ${items[0].title}`.slice(0, 150) : 'This week in gold',
        `Hello,\n\nHere is what we published this week.\n\n${lines}${brief ? `\n\nAnd the latest outlook with the likely range and key levels: [${brief.title}](${brief.url})` : ''}\n\nEverything on the blog is built from our own price data, and our forecasts are scored in public, wrong ones included.${closing}`);
    },
    spotlight() {
      const sel = $('#em_pick'); sel.style.display = '';
      sel.innerHTML = `<label>Which post?</label><select id="em_sp" style="width:100%">${live.slice(0, 40).map(p => `<option value="${esc(p.slug)}">${esc(p.post_date)} - ${esc(p.title)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="b pri" id="em_spgo">Use this post</button></div>`;
      $('#em_spgo').onclick = () => { const p = live.find(x => x.slug === $('#em_sp').value); if (!p) return; sel.style.display = 'none';
        fill(p.title.slice(0, 150), `Hello,\n\nIn case you missed it, this is one of our most useful reads right now:\n\n[${p.title}](${p.url})\n\nIt takes a few minutes and everything in it is explained from the ground up. If it helps, forward it to someone who trades gold.${closing}`); };
    },
    release() {
      const v = (data.config || {}).latest_version || '', notes = String((data.config || {}).release_notes || '').split(/\n+/).filter(Boolean).map(l => '- ' + l.replace(/^[-*•]\s*/, '')).join('\n');
      if (!v) return toast('No EA version is published yet', true);
      fill(`GoldTriEngine EA version ${v} is out`, `Hello,\n\nVersion ${v} of the GoldTriEngine Expert Advisor is now available.\n\n${notes || 'See the changelog for the details.'}\n\nThe full list of changes is here: [EA changelog](${SITE}/changelog.html)\n\nCustomers with an active license can download it from their account.${closing}`);
    },
    code() {
      if (!coupons.length) return toast('You have no active discount code. Create one in the Marketing tab first', true);
      const sel = $('#em_pick'); sel.style.display = '';
      sel.innerHTML = `<label>Which code?</label><select id="em_cd" style="width:100%">${coupons.map(c => `<option value="${esc(c.code)}">${esc(c.code)} - ${c.percent_off ? c.percent_off + '% off' : usd(c.amount_off) + ' off'}${c.expires_at ? ', until ' + esc(String(c.expires_at).slice(0, 10)) : ''}</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="b pri" id="em_cdgo">Use this code</button></div>`;
      $('#em_cdgo').onclick = () => { const c = coupons.find(x => x.code === $('#em_cd').value); sel.style.display = 'none';
        fill(`A discount on GoldTriEngine: ${c.percent_off ? c.percent_off + '% off' : usd(c.amount_off) + ' off'}`, `Hello,\n\nFor a limited time you can use the code ${c.code} on the pricing page${c.percent_off ? ' for ' + c.percent_off + '% off' : ' for ' + usd(c.amount_off) + ' off'}${c.expires_at ? ', valid until ' + String(c.expires_at).slice(0, 10) : ''}.\n\nThis link fills it in for you: [Open pricing with the code](${SITE}/pricing.html?code=${encodeURIComponent(c.code)})\n\nIf you are still unsure, watch the live stream first and test the free backtest EA on your own PC: [free backtest EA](${SITE}/free-backtest.html)${closing}`); };
    },
    news() {
      fill('Heads-up: {{EVENT}} on {{DAY}}', `Hello,\n\nA reminder for gold traders: {{EVENT}} is due on {{DAY}} at {{TIME}} (broker server time may differ, check yours).\n\nGold can move sharply and spreads can widen in the minutes around a release like this. Many traders reduce size or stay out until the first reaction has settled. Whatever you decide, know where your stops are before the release.\n\nHow to read it: [how to read NFP, CPI and other news data](${SITE}/blog/how-to-read-nfp-cpi-news-for-gold/)${closing}`);
      toast('Replace the three {{ }} parts first. The email cannot be sent while they are still there.', true);
    },
    feedback() {
      fill('What should we write about next?', `Hello,\n\nWe write a new gold lesson most weekdays and we would like to cover what you actually want to know.\n\nJust reply to this email with one topic: a question about risk, a news release, how robots work, anything.\n\nThe latest posts are here: [the GoldTriEngine blog](${SITE}/blog/)${closing}`);
    },
  };
  $('#view').querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => { $('#em_pick').style.display = 'none'; tpl[b.dataset.tpl](); });
  clearInterval(window._drt);
  const drawDrafts = async () => {
    const box = $('#dr_list'); if (!box) { clearInterval(window._drt); return; }
    let L = []; try { L = (await call('admin_drafts')) || []; } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message || e)}. Run the latest database update (email drafts) first.</div>`; clearInterval(window._drt); return; }
    box.innerHTML = L.map(d => `<div class="rd-c ${d.status === 'done' ? 'approved' : d.status === 'failed' ? 'hidden' : ''}"><div class="row"><b style="font-weight:600">${esc(d.topic.slice(0, 90))}${d.topic.length > 90 ? '...' : ''}</b><span class="sp" style="flex:1"></span>${d.status === 'done' ? '<span class="pill p-ok">ready</span>' : d.status === 'failed' ? '<span class="pill p-mute">skipped</span>' : '<span class="pill p-warn">' + (d.status === 'working' ? 'writing...' : 'waiting for the PC') + '</span>'}</div>
      ${d.status === 'failed' ? `<div class="mute" style="font-size:12px;margin-top:4px">${esc(d.error || '')}</div>` : ''}
      ${d.status === 'done' && Array.isArray(d.subjects) && d.subjects.length ? `<div class="mute" style="font-size:12px;margin-top:8px">Other subject lines to choose from:</div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">${d.subjects.map((s, i) => `<button class="b" data-sj="${d.id}:${i}" style="padding:3px 10px;font-size:12px">${esc(s)}</button>`).join('')}</div>` : ''}
      <div class="row" style="margin-top:8px">${d.status === 'done' ? `<button class="b pri" data-use="${d.id}">Use this draft</button>` : ''}<button class="b" data-rm="${d.id}">Remove</button></div></div>`).join('') || '<span class="mute" style="font-size:12px">No drafts yet.</span>';
    box.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { const d = L.find(x => String(x.id) === b.dataset.use); $('#em_s').value = d.subject; $('#em_b').value = d.body; upd(); $('#em_s').scrollIntoView({behavior: 'smooth', block: 'center'}); toast('AI draft loaded. Read every line before you send: the AI can be wrong.', true); });
    box.querySelectorAll('[data-sj]').forEach(b => b.onclick = () => { const [id, i] = b.dataset.sj.split(':'); const d = L.find(x => String(x.id) === id); $('#em_s').value = d.subjects[+i]; toast('Subject line changed'); });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { try { await call('admin_draft_dismiss', {p_id: +b.dataset.rm}); drawDrafts(); } catch (e) { toast(e.message || String(e), true); } });
    if (!L.some(d => d.status === 'pending' || d.status === 'working')) clearInterval(window._drt);
  };
  const watch = () => { clearInterval(window._drt); window._drt = setInterval(drawDrafts, 20000); };
  $('#dr_go').onclick = async () => { try { await call('admin_draft_request', {p_topic: $('#dr_t').value}); $('#dr_t').value = ''; toast('Request sent. The PC will write the draft at its next check.'); await drawDrafts(); watch(); } catch (e) { toast(e.message || String(e), true); } };
  drawDrafts().then(() => { if ($('#dr_list') && /waiting|writing/.test($('#dr_list').innerText)) watch(); });
  const post = async body => { const {data: sess} = await sb.auth.getSession(); const r = await fetch(SB_URL + '/functions/v1/send-email', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.session.access_token, apikey: SB_KEY}, body: JSON.stringify(body)}); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; };
  const blanks = () => /\{\{[^}]*\}\}/.test($('#em_s').value + $('#em_b').value);
  $('#em_test').onclick = async () => {
    if ($('#em_s').value.trim().length < 3 || $('#em_b').value.trim().length < 10) return toast('Write a subject and a message first', true);
    if (blanks()) return toast('Fill in the {{ }} parts first', true);
    try { const j = await post({kind: 'broadcast_test', subject: $('#em_s').value, body: $('#em_b').value}); toast('Test sent to ' + j.to); } catch (e) { toast(e.message || String(e), true); }
  };
  $('#em_go').onclick = async () => {
    if ($('#em_s').value.trim().length < 3 || $('#em_b').value.trim().length < 10) return toast('Write a subject and a message first', true);
    if (blanks()) return toast('Fill in the {{ }} parts first', true);
    if (!confirm(`Send "${$('#em_s').value}" to ${B.subscribers} subscriber(s) now?\n\nThis cannot be taken back. Did you send yourself a test first?`)) return;
    $('#em_go').disabled = $('#em_test').disabled = true; $('#em_prog').style.display = '';
    try {
      const c = await call('admin_broadcast_create', {p_subject: $('#em_s').value, p_body: $('#em_b').value}); let sent = 0, failed = 0, rem = c.total;
      while (rem > 0) { const j = await post({kind: 'broadcast_send', broadcast_id: c.id}); sent += j.sent; failed += j.failed; rem = j.remaining; const done = c.total - rem; $('#em_bar').style.width = (done / c.total * 100) + '%'; $('#em_txt').textContent = `${done} of ${c.total} done` + (failed ? `, ${failed} failed` : ''); if (!j.sent && !j.failed) break; }
      toast(`Finished: ${sent} sent` + (failed ? `, ${failed} failed` : ''), failed > 0); await load(); vEmail();
    } catch (e) { toast(e.message || String(e), true); $('#em_go').disabled = $('#em_test').disabled = false; }
  };
}

const fetchT = (url, opts = {}, ms = 8000) => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms); return fetch(url, {...opts, signal: ac.signal}).finally(() => clearTimeout(tm)); };
async function browserChecks() {
  const out = [], add = (id, title, status, detail) => out.push({id, section: 'Website', title, status, detail, fix: id});
  const t0 = () => performance.now();
  const timed = async (p) => { const s = t0(); try { const r = await p; return [r, Math.round(t0() - s)]; } catch (e) { return [null, Math.round(t0() - s)]; } };
  const pages = ['index.html', 'pricing.html', 'contact.html', 'blog/', 'sitemap.xml'];
  const res = await Promise.all(pages.map(p => timed(fetchT('../' + p, {cache: 'no-store'}))));
  const bad = pages.filter((p, i) => !res[i][0] || !res[i][0].ok);
  add('site_pages', 'Website pages answer', bad.length ? 'bad' : 'ok', bad.length ? 'Not answering: ' + bad.join(', ') : 'Home, pricing, contact, blog and sitemap answer (' + Math.max(...res.map(r => r[1])) + ' ms at most).');
  try {
    const x = await fetchT('../blog/feed.xml', {cache: 'no-store'}).then(r => r.text()), m = x.match(/<pubDate>([^<]+)<\/pubDate>/);
    if (m) { const age = (Date.now() - new Date(m[1])) / 864e5; add('feed_stale', 'Newest blog post', age > 3 ? 'warn' : 'ok', 'The newest post is ' + (age < 1 ? 'from today' : Math.floor(age) + ' day(s) old') + '.'); }
  } catch (e) { add('feed_stale', 'Newest blog post', 'warn', 'The blog feed could not be read.'); }
  const [api, ms] = await timed(fetchT(SB_URL + '/rest/v1/rpc/public_settings', {method: 'POST', headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'}, body: '{}'}));
  add('api_slow', 'Database answers', !api || !api.ok ? 'bad' : ms > 2500 ? 'warn' : 'ok', !api || !api.ok ? 'The database did not answer.' : 'Answered in ' + ms + ' ms.');
  const pingMail = ms => timed(fetchT(SB_URL + '/functions/v1/send-email', {method: 'POST', headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'}, body: '{"kind":"ping"}'}, ms));
  let [fn] = await pingMail(8000);
  if (!fn || fn.status < 400 || fn.status >= 500) [fn] = await pingMail(20000);      // a function that was idle needs a moment to wake up: one more try with more time before it counts as a problem
  add('email_fn', 'Email function answers', fn && fn.status >= 400 && fn.status < 500 ? 'ok' : 'bad', fn && fn.status >= 400 && fn.status < 500 ? 'The email function is up.' : 'The email function did not answer correctly' + (fn ? ' (code ' + fn.status + ').' : '.'));
  const [cf] = await timed(fetchT(SB_URL + '/rest/v1/rpc/support_contact', {method: 'POST', headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify({p_name: '', p_email: 'not-an-email', p_topic: 'other', p_subject: '', p_message: 'health check message only'})}));
  const cj = cf ? await cf.json().catch(() => ({})) : {};
  add('contact_rpc', 'Contact form works', cf && /valid email/.test(cj.message || '') ? 'ok' : 'bad', cf && /valid email/.test(cj.message || '') ? 'The contact form refuses a bad address, so it is live.' : 'The contact form did not respond as expected.');
  const [lf] = await timed(fetchT('https://raw.githubusercontent.com/yeliasforex/gte-live/main/account.json', {cache: 'no-store'}));
  add('live_feed', 'Live account numbers file', lf && lf.ok ? 'ok' : 'warn', lf && lf.ok ? 'The live numbers file loads.' : 'The live numbers file could not be loaded.');
  return out;
}

function healthReport(all) {
  const bad = all.filter(c => c.status !== 'ok');
  const lines = ['GoldTriEngine health report, ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC', '', bad.length ? 'Problems found: ' + bad.length : 'No problem found.', ''];
  bad.forEach(c => { lines.push('[' + c.status.toUpperCase() + '] ' + c.section + ': ' + c.title, '  Found: ' + c.detail); const f = FIX[c.fix]; if (f) { lines.push('  Meaning: ' + f[0]); f[1].forEach((s, i) => lines.push('  ' + (i + 1) + '. ' + s)); } lines.push(''); });
  return lines.join('\n');
}

const FIX_RUN = {
  site_pages: [['publish', 'Publish the website again', 'Your PC rebuilds the whole website and publishes it again.']],
  repo: [['publish', 'Publish the waiting changes', 'Your PC publishes the waiting website changes.']],
  feed_stale: [['run_morning', 'Run the morning job', 'Your PC runs the morning job, which makes and publishes the day\'s posts.']],
  blog_runs: [['run_morning', 'Run the morning job', 'Your PC runs the morning job again.']],
  blog_jobs: [['run_morning', 'Run the morning job', 'Your PC runs the morning job again.']],
  ollama: [['ollama', 'Start the local AI', 'Your PC starts the Ollama program (the local AI).']],
  mt5: [['mt5', 'Open MetaTrader 5', 'Your PC opens MetaTrader 5. You still need to check it is logged in.']],
  prices: [['prices', 'Refresh the prices', 'Your PC downloads the latest gold prices from MetaTrader 5. It does not make a forecast.']],
  tasks_setting: [['tasks_setting', 'Fix the task settings', 'Your PC changes the three GTE Blog tasks so they run on battery power and catch up after a missed time.']],
  tasks_failed: [['tasks_run', 'Run the failed task again', 'Your PC starts the failed GTE Blog task again.']],
  disk: [['disk_temp', 'Remove old temporary files', 'Your PC deletes this system\'s own temporary files that are over 2 days old. Nothing else is touched.']],
  pc_seen: [['run_health', 'Ask the PC to report now', 'Your PC runs its checks and reports.']],
  pc_report_old: [['run_health', 'Ask the PC to report now', 'Your PC runs its checks and reports.']],
  tg_queue: [['@telegram', 'Send the stuck messages again', 'The failed Telegram messages of the last 24 hours go back in the queue and are sent again.']],
  tg_failed: [['@telegram', 'Send the failed messages again', 'The failed Telegram messages of the last 24 hours go back in the queue and are sent again.']],
};
const HSEC = ['Website', 'Database', 'Customers and EAs', 'Payments', 'Support', 'Email', 'Telegram and alerts', 'Blog and forecast', 'Your PC'];
const hcOrder = {bad: 0, warn: 1, ok: 2};

async function healthBadge() {
  try {
    const H = await call('admin_health'), all = (H.checks || []).concat(H.pc || []), bad = all.filter(c => c.status === 'bad').length, warn = all.filter(c => c.status === 'warn').length, b = document.querySelector('#tabs button[data-t="health"]');
    if (b && (bad || warn)) b.insertAdjacentHTML('beforeend', `<span class="badge" style="background:${bad ? 'var(--bad)' : 'var(--warn)'}">${bad || warn}</span>`);
  } catch (e) { /* the database update may not be installed yet */ }
}

async function runFix(id, label, what) {
  if (!confirm(label + '?\n\n' + what + '\n\nThe result appears at the top of this page. It can take up to 15 minutes if your PC is busy.')) return;
  try {
    if (id === '@telegram') { const r = await call('admin_fix_telegram'); toast((r && r.requeued) + ' message(s) put back in the queue and sent again.'); }
    else { await call('admin_blog_command', {p_cmd: 'fix', p_arg: id}); toast('Queued. Your PC does it at its next check.'); }
  } catch (e) { toast(e.message || String(e), true); return; }
  vHealth();
}

async function vHealth() {
  clearInterval(window._hct);
  $('#view').innerHTML = '<div class="card mute">Checking every area...</div>';
  let H = null, helps = [], fixes = [];
  try { H = await call('admin_health'); } catch (e) { H = null; }
  try { helps = (await call('admin_health_help_list')) || []; } catch (e) { helps = []; }
  try { fixes = (await call('admin_fix_results')) || []; } catch (e) { fixes = []; }
  let bc = []; try { bc = await browserChecks(); } catch (e) { bc = [{id: 'site_pages', section: 'Website', title: 'Website checks', status: 'warn', detail: 'The website checks could not run: ' + (e.message || e), fix: 'site_pages'}]; }
  const pcAgeMin = H && H.pc_at ? (Date.now() - new Date(H.pc_at)) / 60000 : null;
  let all = [...bc];
  if (H) all = all.concat(H.checks || []).concat(H.pc || []);
  else all.push({id: 'db_update', section: 'Database', title: 'Health checks installed', status: 'warn', detail: 'The newest database update (health center) has not been run yet.', fix: 'contact_rpc'});
  if (H && (pcAgeMin === null || pcAgeMin > 45)) all.push({id: 'pc_report_old', section: 'Your PC', title: 'PC report is recent', status: 'warn', detail: pcAgeMin === null ? 'The PC has not sent its checks yet.' : 'The PC last reported ' + Math.round(pcAgeMin) + ' minutes ago.', fix: 'pc_report_old'});
  const probs = all.filter(c => c.status !== 'ok').sort((a, b) => hcOrder[a.status] - hcOrder[b.status]);
  const nBad = probs.filter(c => c.status === 'bad').length, nWarn = probs.length - nBad, nOk = all.length - probs.length;
  const dot = s => `<span class="hc-dot ${s}"></span>`;
  const card = c => {
    const f = FIX[c.fix] || ['', []], mine = helps.filter(h => h.check_id === c.id), runs = FIX_RUN[c.fix] || [];
    return `<div class="hc-alert ${c.status}"><div class="hc-ah"><span class="hc-tag ${c.status}">${c.status === 'bad' ? 'PROBLEM' : 'WARNING'}</span><span class="hc-sc">${esc(c.section)}</span></div>
      <div class="hc-at">${esc(c.title)}</div><div class="hc-ad">${esc(c.detail)}</div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${runs.map(r => `<button class="b pri hc-fixb" data-run="${esc(r[0])}" data-l="${esc(r[1])}" data-w="${esc(r[2])}">&#9889; ${esc(r[1])}</button>`).join('')}<button class="b" data-steps="${esc(c.id)}">Show the steps</button><button class="b" data-ai="${esc(c.id)}">Ask the local AI to guide me</button></div>
      <div class="hc-steps" id="st_${esc(c.id)}" hidden><p>${esc(f[0])}</p><ol>${f[1].map(s => `<li>${esc(s)}</li>`).join('')}</ol><button class="b" data-cp="${esc(c.id)}">Copy these steps</button></div>
      ${mine.map(h => `<div class="hc-ai ${h.status}"><div class="mute" style="font-size:11px;letter-spacing:.1em">LOCAL AI ${h.status === 'done' ? '' : '(' + (h.status === 'working' ? 'writing...' : h.status === 'failed' ? 'could not help' : 'waiting for your PC') + ')'}</div>${h.answer ? '<div style="white-space:pre-wrap">' + esc(h.answer) + '</div>' : h.error ? '<div class="mute">' + esc(h.error) + '</div>' : ''}<button class="b" data-hx="${h.id}" style="margin-top:6px">Remove</button></div>`).join('')}</div>`;
  };
  const allFixes = [...new Set(probs.flatMap(c => (FIX_RUN[c.fix] || []).map(r => r[0])))].filter(x => x !== '@telegram');
  const secs = HSEC.map(s => [s, all.filter(c => c.section === s).sort((a, b) => hcOrder[a.status] - hcOrder[b.status])]).filter(x => x[1].length);
  const pending = fixes.some(f => f.status === 'queued' || f.status === 'running');
  $('#view').innerHTML = `<div class="hc-banner ${nBad ? 'bad' : nWarn ? 'warn' : 'ok'}"><div class="hc-bn">${nBad ? '&#9888;' : nWarn ? '&#9888;' : '&#10003;'}</div><div style="flex:1;min-width:220px"><div class="hc-bt">${nBad ? nBad + ' problem' + (nBad > 1 ? 's need' : ' needs') + ' your attention' : nWarn ? nWarn + ' warning' + (nWarn > 1 ? 's' : '') + ' to look at' : 'Everything is healthy'}</div>
      <div class="hc-chips"><span class="hc-chip bad">${nBad} problem${nBad === 1 ? '' : 's'}</span><span class="hc-chip warn">${nWarn} warning${nWarn === 1 ? '' : 's'}</span><span class="hc-chip ok">${nOk} ok</span><span class="mute" style="font-size:12px">${all.length} checks${H && H.pc_at ? ' · PC reported ' + Math.max(0, Math.round(pcAgeMin)) + ' min ago' : ''}</span></div></div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="b pri" id="hc_re">Re-check now</button>${allFixes.length ? `<button class="b hc-fixall" id="hc_all">&#9889; Fix everything I can (${allFixes.length})</button>` : ''}<button class="b" id="hc_cp">Copy a report for a helper</button></div></div>
    ${probs.length ? `<h3 class="hc-h3">Needs your attention</h3><div class="hc-alerts">${probs.map(card).join('')}</div>` : '<div class="card" style="text-align:center;padding:26px"><b style="font-size:17px;color:var(--ok)">All good. Nothing needs your attention.</b><div class="mute" style="margin-top:6px">Your PC, website, payments, emails and alerts all passed.</div></div>'}
    ${fixes.length ? `<div class="card"><div class="row"><b>Repairs</b><span class="mute">what your PC did when you pressed a fix button</span>${pending ? '<span class="pill p-warn">working...</span>' : ''}</div>${fixes.map(f => `<div class="hc-fr ${f.status === 'done' && /^Done/.test(f.result || '') ? 'ok' : f.status === 'done' ? 'bad' : ''}"><b>${esc(f.fix)}</b> <span class="mute">${esc(String(f.created_at).slice(5, 16).replace('T', ' '))}</span> ${f.status === 'queued' ? '<span class="pill p-warn">waiting for the PC</span>' : f.status === 'running' ? '<span class="pill p-warn">running</span>' : ''}<div>${esc(f.result || '')}</div></div>`).join('')}</div>` : ''}
    <h3 class="hc-h3">All areas</h3><div class="hc-grid">${secs.map(([s, cs]) => { const w = cs.some(c => c.status === 'bad') ? 'bad' : cs.some(c => c.status === 'warn') ? 'warn' : 'ok'; return `<details class="card hc-sec ${w}" ${w === 'ok' ? '' : 'open'}><summary><b>${dot(w)}${esc(s)}</b><span class="mute">${cs.filter(c => c.status === 'ok').length}/${cs.length} ok</span></summary>${cs.map(c => `<div class="hc-row ${c.status}"><div class="hc-h">${dot(c.status)}<b>${esc(c.title)}</b><span class="mute hc-d">${esc(c.detail)}</span></div></div>`).join('')}</details>`; }).join('')}</div>
    <div id="hea"></div>`;
  $('#hc_re').onclick = async () => { $('#hc_re').disabled = true; try { await call('admin_blog_command', {p_cmd: 'run_health'}); } catch (e) { /* already queued */ } vHealth(); };
  $('#hc_cp').onclick = async () => { try { await navigator.clipboard.writeText(healthReport(all)); toast('Report copied. Paste it to your helper.'); } catch (e) { toast('Could not copy', true); } };
  const ha = $('#hc_all'); if (ha) ha.onclick = async () => { if (!confirm('Run ' + allFixes.length + ' ready-made repair(s) on your PC?\n\nEach one is explained on its own button. The results appear at the top of this page.')) return; let n = 0; for (const f of allFixes) { try { await call('admin_blog_command', {p_cmd: 'fix', p_arg: f}); n++; } catch (e) { /* already queued */ } } toast(n + ' repair(s) queued.'); vHealth(); };
  $('#view').querySelectorAll('[data-run]').forEach(b => b.onclick = () => runFix(b.dataset.run, b.dataset.l, b.dataset.w));
  $('#view').querySelectorAll('[data-steps]').forEach(b => b.onclick = () => { const e = document.getElementById('st_' + b.dataset.steps); e.hidden = !e.hidden; b.textContent = e.hidden ? 'Show the steps' : 'Hide the steps'; });
  $('#view').querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => { const c = all.find(x => x.id === b.dataset.cp), f = FIX[c.fix]; try { await navigator.clipboard.writeText(c.title + '\n' + c.detail + '\n\n' + f[0] + '\n' + f[1].map((s, i) => (i + 1) + '. ' + s).join('\n')); toast('Steps copied'); } catch (e) { toast('Could not copy', true); } });
  $('#view').querySelectorAll('[data-ai]').forEach(b => b.onclick = async () => { const c = all.find(x => x.id === b.dataset.ai), f = FIX[c.fix]; try { await call('admin_health_help_request', {p_check: c.id, p_title: c.title, p_detail: c.detail, p_steps: f[1].map((s, i) => (i + 1) + '. ' + s).join('\n')}); toast('Asked. Your PC answers within about 15 minutes; the written steps work right now.'); vHealth(); } catch (e) { toast(e.message || String(e), true); } });
  $('#view').querySelectorAll('[data-hx]').forEach(b => b.onclick = async () => { try { await call('admin_health_help_dismiss', {p_id: +b.dataset.hx}); vHealth(); } catch (e) { toast(e.message || String(e), true); } });
  if (pending || helps.some(h => h.status === 'pending' || h.status === 'working')) window._hct = setInterval(() => { if (tab !== 'health') clearInterval(window._hct); else vHealth(); }, 30000);
  vHealthEA();
}


start();

<script>
/* day / night switch for the admin panel; follows the device until a choice is made, then remembers it */
