// ---------- Backtest: upload an MT5 report, the website updates by itself ----------
const BTM = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const btMoney = v => (v < 0 ? '-' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US');
function btPreview(r) {
  const mx = Math.max(...r.years.map(y => y[1]), 1), part = +r.end.slice(5, 7) < 12 || +r.end.slice(8) < 20;
  return `<div class="grid" style="margin:12px 0">
    ${kx('Period', r.start.slice(0, 4) + ' to ' + r.end.slice(0, 4), r.start + ' to ' + r.end)}
    ${kx('Trades', r.trades, 'profit factor ' + r.pf.toFixed(2))}
    ${kx('Winning trades', r.win_pct1.toFixed(1) + '%', 'average win ' + r.payoff.toFixed(2) + 'x the average loss')}
    ${kx('Largest drawdown', r.eq_dd_rel.toFixed(1) + '%', 'relative equity')}
    ${kx('Months positive', r.months_pos + ' of ' + r.months_total, 'start $' + r.deposit.toLocaleString('en-US'))}</div>
  <div class="row" style="gap:10px;flex-wrap:wrap">${r.years.map(([y, v], i) => `<div class="kpi" style="min-width:120px"><span class="mute">${y}${part && i === r.years.length - 1 ? ' so far' : ''}</span><b style="color:var(--ok,#3fb27f)">+${v}%</b></div>`).join('')}</div>
  <div class="mute" style="margin-top:10px">Best month ${(m => BTM[m[1] - 1] + ' ' + m[0] + ' ' + btMoney(m[2]))(r.months.reduce((a, b) => b[2] > a[2] ? b : a))} · worst month ${(m => BTM[m[1] - 1] + ' ' + m[0] + ' ' + btMoney(m[2]))(r.months.reduce((a, b) => b[2] < a[2] ? b : a))} · balance ends at $${Math.round(r.final).toLocaleString('en-US')}</div>`;
}

  $('#pwl').innerHTML = rows.length ? `<div class="tblw"><table class="tbl"><tr><th>Account</th><th>Plan</th><th>Trades</th><th>Days</th><th>On the wall?</th><th></th></tr>${rows.map(r => `<tr><td>${esc(r.name || '')}<div class="mono mute" style="font-size:12px">${esc(r.email || '')}</div></td><td>${esc(r.plan || '-')}</td><td>${r.trades}</td><td>${r.days}</td><td><span style="color:${r.shown ? '#3fb27f' : '#8b95a3'}">${r.shown ? (on ? 'Shown' : 'Qualifies (wall is off)') : esc(r.reason)}</span></td><td>${r.reason.startsWith('Admin') || r.demo ? '' : `<button class="b ${r.hidden ? '' : 'dng'}" data-h="${r.user_id}" data-s="${r.hidden ? 0 : 1}">${r.hidden ? 'Unhide' : 'Hide'}</button>`}</td></tr>`).join('')}</table></div>` : '<div class="mute">No account owns a license yet.</div>';
  $('#pwl').querySelectorAll('[data-h]').forEach(b => b.onclick = async () => { await call('admin_wall_hide', {p_user: b.dataset.h, p_hidden: b.dataset.s === '1'}); toast(b.dataset.s === '1' ? 'Hidden' : 'Visible again'); vProof(); });
}
function vVideos() {

  <div class="row" style="margin-top:10px"><input id="vt" placeholder="Title" style="flex:1;min-width:160px"><input id="vu" placeholder="https://www.youtube.com/watch?v=..." style="flex:2;min-width:200px"><button class="b pri" id="va">Add</button></div>
  <div class="tblw"><table class="tbl">${data.videos.map(v => `<tr><td style="width:120px">${(m => m ? `<img class="th" loading="lazy" src="https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg" alt="">` : '')(String(v.url).match(/(?:v=|youtu\.be\/)([\w-]{11})/))}</td><td>${esc(v.title)}</td><td class="mono mute">${esc(v.url)}</td><td><button class="b dng" data-v="${v.id}">Remove</button></td></tr>`).join('') || '<tr><td class="mute">No videos yet. The website shows a clean placeholder.</td></tr>'}</table></div></div>`;
  $('#va').onclick = async () => { if (!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test($('#vu').value)) return toast('Use a YouTube link', true); await call('admin_video', {p_action: 'add', p_title: $('#vt').value, p_url: $('#vu').value}); await load(); vVideos(); };
  $('#view').querySelectorAll('[data-v]').forEach(b => b.onclick = async () => { await call('admin_video', {p_action: 'delete', p_id: +b.dataset.v}); await load(); vVideos(); });

function vAudit() {
  const q = (window._aq || '').toLowerCase(), A = data.audit.filter(a => !q || (a.action + JSON.stringify(a.detail || {})).toLowerCase().includes(q));
  const ac = a => /delete|disable|cancel|unbind|reject/.test(a) ? '#e5534b' : /create|assign|publish|confirm|enable/.test(a) ? '#3fb27f' : /save|set|update|extend|plan|allowance/.test(a) ? '#4f8ff7' : '#8b95a3';
  $('#view').innerHTML = `<div class="card"><div class="row"><input id="aq" placeholder="Search the log (action or details)" value="${esc(window._aq || '')}" style="flex:1"><span class="mute">${A.length} entries</span></div>
  <div class="tl">${A.map((a, i) => `<div class="te" style="--c:${ac(a.action)};animation-delay:${Math.min(i, 20) * 25}ms"><u></u><div><b>${esc(a.action)}</b> <span class="mute">${fmt(a.at)} · ${esc(String(a.actor).slice(0, 8))}</span><div class="mono mute" style="font-size:12px;word-break:break-all">${esc(JSON.stringify(a.detail || {}))}</div></div></div>`).join('') || '<div class="mute">Nothing matches.</div>'}</div></div>`;
  $('#aq').oninput = e => { window._aq = e.target.value; clearTimeout(window._t); window._t = setTimeout(() => { vAudit(); const i = $('#aq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200); };
}
/* ---- Revenue and Marketing tabs (growth tools) ---- */
const csvCell = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const downloadCsv = (name, cols, rows) => {
  const body = [cols.map(c => c[0]).join(',')].concat(rows.map(r => cols.map(c => csvCell(typeof c[1] === 'function' ? c[1](r) : r[c[1]])).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + body], {type: 'text/csv'})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
const needsUpdate = e => `<div class="msg err">${esc((e && e.message) || e)}. Run the latest database update (the growth SQL) first.</div>`;

function revChart(M) {
  const W = 640, H = 190, px = 34, py = 24, n = M.length, mx = Math.max(1, ...M.map(m => Number(m.revenue_usd))) * 1.15;
  const X = i => n === 1 ? W / 2 : px + i * (W - 2 * px) / (n - 1), Y = v => H - py - (Number(v) / mx) * (H - 2 * py - 6);
  const pts = M.map((m, i) => [X(i), Y(m.revenue_usd)]), line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = n > 1 ? line + ` L${pts[n - 1][0].toFixed(1)} ${H - py} L${pts[0][0].toFixed(1)} ${H - py} Z` : '';
  const grid = [0, .25, .5, .75, 1].map(f => { const y = H - py - f * (H - 2 * py - 6); return `<line x1="${px}" x2="${W - px}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${px - 6}" y="${y + 4}" text-anchor="end" fill="var(--mute)" font-size="10">${f ? '$' + Math.round(mx * f / 1.15).toLocaleString('en-US') : '0'}</text>`; }).join('');
  return `<svg class="rv-svg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Money received per month"><defs><linearGradient id="rvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".45"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${grid}
    ${area ? `<path class="area" d="${area}" fill="url(#rvg)"/>` : ''}${n > 1 ? `<path class="line" d="${line}" fill="none" stroke="var(--gold2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--bg)" stroke="var(--gold2)" stroke-width="2"><title>${esc(M[i].month)}: ${usd(M[i].revenue_usd)}</title></circle><text x="${p[0].toFixed(1)}" y="${H - 6}" text-anchor="middle" fill="var(--mute)" font-size="10">${esc(String(M[i].month).slice(2))}</text>`).join('')}</svg>`;
}
const ringSvg = (pct, label) => { const C = 339.3, to = C * (1 - Math.min(100, Math.max(0, pct)) / 100); return `<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${esc(label)}"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--panel2)" stroke-width="12"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 70 70)" style="stroke-dasharray:${C};stroke-dashoffset:${C};--to:${to.toFixed(1)};animation:rg 1.5s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 6px var(--ok))"/><text x="70" y="68" text-anchor="middle" fill="var(--text)" font-size="26" font-weight="700">${pct == null ? '-' : pct + '%'}</text><text x="70" y="88" text-anchor="middle" fill="var(--mute)" font-size="10">${esc(label)}</text></svg>`; };

async function vRevenue() {
  $('#view').innerHTML = '<div class="card mute">Loading...</div>';
  let r; try { r = (await call('admin_revenue')) || {}; } catch (e) { $('#view').innerHTML = `<div class="card">${needsUpdate(e)}</div>`; return; }
  const T = r.totals || {}, L = r.licenses || {}, M = (r.months || []).slice(-12);
  const sum = k => M.reduce((s, m) => s + Number(m[k] || 0), 0), pu = sum('purchases'), re = sum('renewals'), up = sum('upgrades'), tot = Math.max(1, pu + re + up);
  const best = M.reduce((b, m) => Number(m.revenue_usd) > Number(b.revenue_usd || 0) ? m : b, {});
  $('#view').innerHTML = `<div class="grid" style="margin-bottom:14px">${kx('Money received', Math.round(T.revenue_usd || 0), (T.paid_orders || 0) + ' paid orders' + (T.free_keys ? ' · ' + T.free_keys + ' free key(s) not counted' : ''), 'var(--ok)', false, '$')}
    ${kx('Refunded', Math.round(T.refunded_usd || 0), 'marked refunded in Orders', (T.refunded_usd || 0) > 0 ? 'var(--warn)' : '', false, '$')}
    ${kx('Active licenses', L.active || 0, (L.expiring_30 || 0) + ' end within 30 days', 'var(--info)')}
    ${kx('Waiting for you', T.waiting || 0, 'orders started or claimed, not confirmed', (T.waiting || 0) ? 'var(--warn)' : '')}</div>
  <div class="card"><div class="row"><b>Money received per month</b><span class="sp" style="flex:1"></span><button class="b" id="x_ord">Download orders (CSV)</button><button class="b" id="x_lic">Download licenses (CSV)</button></div>
    ${M.length ? `<div class="rv-hero"><div>${revChart(M)}</div><div style="text-align:center">${ringSvg(L.renewal_rate_pct == null ? 0 : L.renewal_rate_pct, 'renewal rate')}<div class="mute" style="font-size:12px;margin-top:4px">${L.renewal_rate_pct == null ? 'not enough data yet' : (L.renewed_90 || 0) + ' renewed vs ' + (L.expired_90 || 0) + ' ended (90 days)'}</div></div></div>
      <div class="mute" style="margin:10px 0 6px;font-size:12px">What was sold</div>
      <div class="sg"><i style="--c:var(--ok);--w:${pu / tot * 100}%"></i><i style="--c:var(--info);--w:${re / tot * 100}%"></i><i style="--c:var(--gold);--w:${up / tot * 100}%"></i></div>
      <div class="row mute" style="font-size:12px;margin-top:6px;gap:16px"><span><span class="dot on"></span>New ${pu}</span><span><span class="dot" style="background:var(--info)"></span>Renewals ${re}</span><span><span class="dot" style="background:var(--gold)"></span>Upgrades ${up}</span>${best.month ? `<span style="margin-left:auto">Best month: <b style="color:var(--gold2)">${esc(best.month)}</b> ${usd(best.revenue_usd)}</span>` : ''}</div>
      <div class="tblw"><table class="tbl"><tr><th>Month</th><th>Received</th><th>New</th><th>Renewals</th><th>Upgrades</th><th>Refunds</th><th>Discounts given</th></tr>
      ${M.slice().reverse().map(m => `<tr><td class="mono">${esc(m.month)}</td><td><b>${usd(m.revenue_usd)}</b></td><td>${m.purchases}</td><td>${m.renewals}</td><td>${m.upgrades}</td><td>${m.refunds ? m.refunds + ' (' + usd(m.refunded_usd) + ')' : '-'}</td><td>${Number(m.discounts_usd) ? usd(m.discounts_usd) : '-'}</td></tr>`).join('')}</table></div>`
      : '<p class="mute">No paid orders yet. The chart appears after the first payment is confirmed.</p>'}
    <p class="mute" style="margin:10px 0 0;font-size:12px">Only orders you confirmed as paid count. Free keys (marked free in Orders) and refunds are kept out. The renewal rate is a rough guide: renewals paid in the last 90 days against licenses that ended in the same time.</p></div>`;
  $('#x_ord').onclick = () => downloadCsv('orders.csv', [['ref', 'ref'], ['date', o => String(o.created_at || '').slice(0, 10)], ['customer', 'email'], ['type', 'kind'], ['plan', o => planName(o.plan_id)], ['amount_usd', 'amount_usd'], ['original_usd', 'original_amount_usd'], ['free_key', o => o.complimentary ? 'yes' : ''], ['discount_usd', 'discount_usd'], ['coupon', 'coupon_code'], ['status', 'status'], ['customer_reference', 'paid_ref'], ['confirmed', o => String(o.confirmed_at || '').slice(0, 10)]], data.orders);
  $('#x_lic').onclick = () => downloadCsv('licenses.csv', [['key', 'key'], ['plan', l => planName(l.plan_id)], ['status', 'status'], ['customer', 'owner_email'], ['account', 'bound_account'], ['broker', 'bound_broker'], ['activated', l => String(l.activated_at || '').slice(0, 10)], ['expires', l => String(l.expires_at || '').slice(0, 10)]], data.licenses);
}

async function vMarketing() {
  const c = data.config || {};
  $('#view').innerHTML = '<div class="card mute">Loading...</div>';
  let co = [], sb = {rows: [], active: 0, unsubscribed: 0}, af = {by_broker: [], daily: []}, err = null;
  try { [co, sb, af] = await Promise.all([call('admin_coupons'), call('admin_subscribers'), call('admin_aff_stats')]); co = co || []; sb = sb || {rows: [], active: 0, unsubscribed: 0}; af = af || {by_broker: [], daily: []}; } catch (e) { err = e; }
  if (err) { $('#view').innerHTML = `<div class="card">${needsUpdate(err)}</div>`; return; }
  const bOn = c.banner_on === 'true', dmax = Math.max(1, ...af.daily.map(d => Number(d.clicks))), bmax = Math.max(1, ...af.by_broker.map(b => Number(b.total)));

  <div class="card"><div class="row"><b>Site banner</b><span class="sp" style="flex:1"></span>${bOn ? '<span class="vz-dot"></span><span class="mute">live</span>' : '<span class="mute">off</span>'}</div>
    <div class="mute" style="font-size:12px;margin-bottom:8px">One line at the top of every public page; visitors can close it. Pages pick up a change within 5 minutes.</div>
    <div class="mk-prev" id="bn_prev">${esc(c.banner_text || 'Your message appears here')}${c.banner_link ? ' <u>Learn more</u>' : ''}</div>
    <label>Text (max 200 characters)</label><input id="bn_t" maxlength="200" value="${esc(c.banner_text || '')}" style="width:100%">

  <div class="card"><b>Discount codes</b> <span class="mute">typed on the pricing page; works on new purchases and renewals. Share a link like pricing.html?code=NAME</span>
    <div class="row" style="margin:10px 0;flex-wrap:wrap"><input id="cp_c" placeholder="CODE" maxlength="24" style="width:130px;text-transform:uppercase"><input id="cp_p" type="number" min="1" max="90" placeholder="% off" style="width:90px"><span class="mute">or</span><input id="cp_a" type="number" min="1" placeholder="$ off" style="width:90px">
      <input id="cp_m" type="number" min="1" placeholder="max uses" style="width:100px"><input id="cp_e" type="date" title="last valid day" style="width:150px"><input id="cp_n" placeholder="note for yourself" style="flex:1;min-width:140px"><button class="b pri" id="cp_s">Save code</button></div>
    ${co.length ? `<div class="tkg">${co.map(x => `<div class="tk${x.active ? '' : ' off'}"><div class="row"><b class="code">${esc(x.code)}</b><span class="sp" style="flex:1"></span>${x.active ? '<span class="pill p-ok">on</span>' : '<span class="pill p-mute">off</span>'}</div>
      <div style="font-size:22px;font-weight:700;margin:4px 0">${x.percent_off ? x.percent_off + '% off' : usd(x.amount_off) + ' off'}</div>
      <div class="mute" style="font-size:12px">${x.used}${x.max_uses ? ' of ' + x.max_uses : ''} used · ${usd(x.given_usd)} given · ${x.expires_at ? 'until ' + esc(String(x.expires_at).slice(0, 10)) : 'no end date'}${x.note ? ' · ' + esc(x.note) : ''}</div>

    <p class="mute" style="margin:10px 0 0;font-size:12px">The price never drops below $1. Fill the percent or the dollar amount, not both. Cancelled orders do not count as a use.</p></div>

  <div class="card"><div class="row"><b>Newsletter subscribers</b> <span class="mute">${sb.active} subscribed · ${sb.unsubscribed} unsubscribed</span><span class="sp" style="flex:1"></span><button class="b" id="sb_x">Download subscribed (CSV)</button></div>
    <p class="mute" style="margin:6px 0 0;font-size:12px">From the sign-up box on the blog and main pages. Email only subscribed people and keep the unsubscribe link in every email.</p>
    ${sb.rows.length ? `<div class="tblw"><table class="tbl"><tr><th>Email</th><th>From page</th><th>Joined</th><th>Status</th></tr>${sb.rows.slice(0, 50).map(s => `<tr><td>${esc(s.email)}</td><td class="mute">${esc(s.source)}</td><td class="mute">${fmt(s.created_at)}</td><td>${s.unsubscribed_at ? '<span class="pill p-mute">unsubscribed</span>' : '<span class="pill p-ok">subscribed</span>'}</td></tr>`).join('')}</table></div>` : ''}</div>

    <div class="mb" style="margin-top:14px">${af.daily.slice(-14).map((d, i) => `<div><i style="--h:${Math.max(6, Number(d.clicks) / dmax * 100)}%;animation-delay:${i * 60}ms"></i><b>${d.clicks}</b><small>${esc(String(d.day).slice(5))}</small></div>`).join('')}</div>` : '<p class="mute">No clicks recorded yet.</p>'}
    <p class="mute" style="margin:8px 0 0;font-size:12px">Clicks only. Whether a click became a funded account is visible in your broker's partner dashboard, not here.</p></div>`;
  const prev = () => { $('#bn_prev').innerHTML = esc($('#bn_t').value || 'Your message appears here') + ($('#bn_l').value ? ' <u>Learn more</u>' : ''); };
  $('#bn_t').oninput = prev; $('#bn_l').oninput = prev;
  $('#bn_on').onclick = async () => { try { await call('admin_set_banner', {p_on: true, p_text: $('#bn_t').value, p_link: $('#bn_l').value}); toast('Banner is on'); await load(); render(); } catch (e) { toast(e.message || String(e), true); } };
  $('#bn_off').onclick = async () => { try { await call('admin_set_banner', {p_on: false, p_text: $('#bn_t').value, p_link: $('#bn_l').value}); toast('Banner is off'); await load(); render(); } catch (e) { toast(e.message || String(e), true); } };

  const sx = $('#sb_x'); if (sx) sx.onclick = () => downloadCsv('subscribers.csv', [['email', 'email'], ['source', 'source'], ['joined', s => String(s.created_at || '').slice(0, 10)]], sb.rows.filter(s => !s.unsubscribed_at));
}
