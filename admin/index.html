<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GoldTriEngine Admin</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242d;--line:#2a323d;--text:#e6e9ee;--mute:#8b95a3;--gold:#e0b24a;--gold2:#f5d27a;--ok:#3fb27f;--bad:#e5534b;--warn:#e0a03a;--info:#4f8ff7}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--text:#17191c;--mute:#667180;--gold:#a87a14;--gold2:#8c6410;--ok:#1d8a5c;--bad:#c93c35;--warn:#b57a14;--info:#2e6fe0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;letter-spacing:.04em}
header h1 b{color:var(--gold)}
header .sp{flex:1}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{color:var(--text);background:var(--panel);border-color:var(--line)}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:6px}
main{padding:16px;max-width:1280px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px}
button.b{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.b:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button.dng{border-color:var(--bad);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse}
.tblw{overflow-x:auto}
.tbl th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.p-ok{color:var(--ok);border-color:var(--ok)}.p-bad{color:var(--bad);border-color:var(--bad)}.p-warn{color:var(--warn);border-color:var(--warn)}.p-info{color:var(--info);border-color:var(--info)}.p-mute{color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace}
.mute{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.kx{position:relative;overflow:hidden;transition:transform .2s,border-color .2s}.kx:hover{transform:translateY(-3px);border-color:var(--gold)}.kpi.kx b{font-size:30px}.hot{box-shadow:0 0 0 0 rgba(224,160,58,.5);animation:hotp 2.2s infinite}@keyframes hotp{70%{box-shadow:0 0 0 10px rgba(224,160,58,0)}100%{box-shadow:0 0 0 0 rgba(224,160,58,0)}}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:8px}.spark i{flex:1;background:linear-gradient(var(--gold2),var(--gold));border-radius:2px 2px 0 0;opacity:.85;transform-origin:bottom;animation:sg .6s both}@keyframes sg{from{transform:scaleY(0)}}
.fn{display:grid;gap:8px}.fr{display:grid;grid-template-columns:150px 1fr 48px 44px;gap:10px;align-items:center;font-size:13px}.ft{height:14px;background:var(--panel2);border-radius:8px;overflow:hidden}.ft i{display:block;height:100%;width:0;min-width:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));border-radius:8px;animation:fw 1.1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fw{to{width:var(--w)}}.fr em{font-style:normal;color:var(--mute);text-align:right}.fr b{text-align:right}
.gts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}.gt{position:relative;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 16px;color:var(--text);cursor:pointer;transition:transform .18s,border-color .18s,background .18s}.gt:hover{transform:translateY(-3px);border-color:var(--c)}.gt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}.gt b{display:block;font-size:26px;color:var(--c)}.gt span{font-size:12px;color:var(--mute)}.gt u{position:absolute;left:0;bottom:0;height:3px;width:var(--p);background:var(--c);transition:width .8s}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:8px;font-size:12px;font-weight:700;color:#0e1116;background:var(--c);vertical-align:middle}.tbl tr[data-u]{transition:background .15s}.tbl tr[data-u]:hover{background:var(--panel2)}
@media (max-width:600px){.fr{grid-template-columns:100px 1fr 36px 38px}}
@media (prefers-reduced-motion:reduce){.hot,.spark i,.ft i{animation:none}.ft i{width:var(--w)}}
#view.enter{animation:vin .45s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.card>b:first-child{display:inline-block;padding-left:10px;border-left:3px solid var(--gold);margin-bottom:6px}
.sg{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--panel2);gap:2px}.sg i{display:block;width:0;background:var(--c);animation:sgw 1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes sgw{to{width:var(--w)}}
.sgl{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:var(--mute)}.sgl u{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.sgl b{color:var(--text)}
.mb{display:flex;align-items:flex-end;gap:12px;height:150px}.mb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}.mb i{display:block;width:100%;max-width:56px;height:var(--h);background:linear-gradient(var(--gold2),var(--gold));border-radius:6px 6px 0 0;transform-origin:bottom;animation:sg .7s both}.mb b{font-size:11px}.mb small{color:var(--mute);font-size:11px}
.ring{display:flex;align-items:center;gap:22px;flex-wrap:wrap}@keyframes rg{to{stroke-dashoffset:var(--to)}}
.th{width:104px;height:58px;object-fit:cover;border-radius:8px;display:block;transition:transform .2s}.th:hover{transform:scale(1.06)}
.tl{margin-top:12px;padding-left:6px}.te{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);animation:vin .4s both}.te u{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.card{transition:border-color .2s}.card:hover{border-color:#3a4553}#tabs button{transition:transform .15s,background .15s}#tabs button:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){#view.enter,.sg i,.mb i,.te{animation:none}.sg i{width:var(--w)}}
.sw{position:relative;display:inline-block;width:42px;height:24px}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.25s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#8b95a3;transition:.25s}.sw input:checked+i{background:rgba(63,178,127,.25);border-color:var(--ok)}.sw input:checked+i::after{left:21px;background:var(--ok)}
.auto.live{border-color:var(--ok);box-shadow:0 0 0 0 rgba(63,178,127,.4);animation:hotp2 3s infinite}@keyframes hotp2{70%{box-shadow:0 0 0 10px rgba(63,178,127,0)}100%{box-shadow:0 0 0 0 rgba(63,178,127,0)}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:22px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;z-index:10;box-shadow:-10px 0 30px #0006}
.drawer h3{margin:0 0 4px}
.acv{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}.acv-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.acv iframe{flex:1;border:0;width:100%;background:#06080e}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;border:1px solid var(--line);background:var(--panel2)}
.msg.err{border-color:var(--bad);color:var(--bad)}.msg.okk{border-color:var(--ok);color:var(--ok)}
.hide{display:none!important}
label{display:block;color:var(--mute);font-size:12px;margin:8px 0 3px}
@media (max-width:640px){main{padding:10px}.tbl td,.tbl th{padding:7px 5px}}
</style>
</head>
<body>
<div id="login" class="login hide">
  <div class="card">
    <h1 style="margin:0 0 4px">Gold<b style="color:var(--gold)">Tri</b>Engine</h1>
    <div class="mute" style="margin-bottom:14px">Admin sign-in</div>
    <div id="stepEmail">
      <label>Email</label><input id="email" type="email" style="width:100%" autocomplete="email">
      <div class="row" style="margin-top:12px"><button class="b pri" id="sendLink">Email me a sign-in link</button></div>
      <div class="mute" style="margin:14px 0 6px;text-align:center">or</div>
      <div class="row"><button class="b" id="gLogin" style="width:100%">Continue with Google</button></div>
    </div>
    <div id="stepMfa" class="hide">
      <div class="mute" style="margin-bottom:10px">Second step: we send a 6-digit code to the owner's Telegram.</div>
      <div class="row"><button class="b" id="sendTg">Send the code to my Telegram</button></div>
      <label>6-digit code from Telegram</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="width:100%;font-size:20px;letter-spacing:.3em">
      <div class="row" style="margin-top:12px"><button class="b pri" id="verifyMfa">Verify</button><button class="b" id="tgOut">Sign out</button></div>
    </div>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="hide">
  <header><h1>Gold<b>Tri</b>Engine <span class="mute">admin</span></h1><span class="sp"></span><span class="mute" id="who"></span><button class="b" id="out">Sign out</button></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="drawer" class="drawer hide"></div>
<div id="acv" class="acv hide"><div class="acv-h"><b id="acvt"></b><span style="flex:1"></span><button class="b" id="acvx">Close</button></div><iframe id="acvf" title="Customer account view"></iframe></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://ekljeyquxvlfbeadgszx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbGpleXF1eHZsZmJlYWRnc3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTI5MzYsImV4cCI6MjEwNzg2ODkzNn0.SlM13aMEy-mTO_iuPTvZz5l4BO0xZnvPBJKAVnZKVx8'; // public anon key
const DEMO = new URLSearchParams(location.search).has('demo');
const SITE = /github\.io$/.test(location.hostname) ? '../' : 'https://yeliasforex.github.io/';   // the customer page lives on the live site; sign in to the live admin (/admin/) to use the account view
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toISOString().slice(0, 16).replace('T', ' ') : '-';
const usd = n => n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
let sb, data = {licenses: [], orders: [], customers: [], config: {}, audit: [], plans: [], videos: []}, tab = 'orders';

// ---------- demo data (?demo=1) so the layout can be reviewed without signing in ----------
function demoClient() {
  const now = Date.now(), iso = d => new Date(now + d * 864e5).toISOString();
  const L = [
    {id:'1',key:'GTE-7QK2-XM9A-D4PF',plan_id:'tycoon',status:'active',created_at:iso(-40),activated_at:iso(-39),expires_at:iso(326),bound_account:51234567,bound_broker:'IC Markets',bound_is_demo:false,extra_allowance_usd:0,owner_email:'amina@example.com',online:true,last_heartbeat:iso(0),balance:9820.5,equity:9911.2,funded_usd:9500,over_limit:false,engine_state:'IN TRADE',ea_version:'1.08',problems:[]},
    {id:'2',key:'GTE-LM4R-ZX2B-9QWE',plan_id:'investor',status:'active',created_at:iso(-12),activated_at:iso(-11),expires_at:iso(354),bound_account:70011223,bound_broker:'Fusion Markets',bound_is_demo:false,extra_allowance_usd:0,owner_email:'omar@example.com',online:true,last_heartbeat:iso(0),balance:6100,equity:6040,funded_usd:5900,over_limit:true,engine_state:'PAUSED',ea_version:'1.08',problems:['OVER_LIMIT']},
    {id:'3',key:'GTE-BB92-KT3C-PL7Y',plan_id:'mogul',status:'active',created_at:iso(-90),activated_at:iso(-88),expires_at:iso(5),bound_account:30998877,bound_broker:'Pepperstone',bound_is_demo:true,extra_allowance_usd:0,owner_email:'lee@example.com',online:false,last_heartbeat:iso(-0.3),balance:15200,equity:15200,funded_usd:15000,over_limit:false,engine_state:'RUNNING',ea_version:'1.08',problems:['HEARTBEAT_MISSING','EXPIRING_SOON']},

    {id:'o1',ref:'GTE-A91C4E',kind:'purchase',plan_id:'tycoon',amount_usd:1900,status:'paid_claimed',paid_ref:'Binance tx 88213',email:'new@example.com',created_at:iso(-0.1)},

  const P = [{id:'investor',name:'Investor',limit_usd:5000,price_usd:1000,popular:false,active:true,sort:1},{id:'tycoon',name:'Tycoon',limit_usd:10000,price_usd:1900,popular:true,active:true,sort:2},{id:'mogul',name:'Mogul',limit_usd:20000,price_usd:3600,popular:false,active:true,sort:3},{id:'billionaire',name:'Billionaire',limit_usd:null,price_usd:5000,popular:false,active:true,sort:4}];
  const rpc = async n => ({data: {admin_licenses:L, admin_orders:O, admin_customers:[{user_id:'u',email:'amina@example.com',created_at:iso(-40),telegram:true,licenses:1}], admin_config:{payment_instructions:'Send USDT (TRC20) to the address in the payment link and paste the transaction ID.',payment_link:'https://example.com/pay',support_url:'https://t.me/GoldTriEngine_Support',latest_version:'1.08',unbind_fee_usd:'100',limit_tolerance_pct:'5',offline_minutes:'15'}, admin_audit:[{id:1,at:iso(-1),actor:'owner',action:'confirm_payment',detail:{order:'GTE-77F0A1'}}], admin_export:{}}[n], error: null});
  const q = t => ({select: () => ({order: async () => ({data: t === 'plans' ? P : []})})});
  return {rpc, from: q, auth: {getSession: async () => ({data: {session: {user: {email: 'demo@admin'}}}}), mfa: {}}};
}

// ---------- sign-in: email link or Google, then a 6-digit code sent to the owner Telegram (the database refuses admin calls until this login session is verified) ----------
async function start() {
  if (DEMO) { sb = demoClient(); return enter(); }
  sb = supabase.createClient(SB_URL, SB_KEY, {auth: {detectSessionInUrl: true, persistSession: true}});
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hide'); return; }
  await mfaGate();
}
async function mfaGate() {
  $('#login').classList.remove('hide'); $('#stepEmail').classList.add('hide'); $('#stepMfa').classList.remove('hide'); $('#app').classList.add('hide');
  const {data: g, error} = await sb.rpc('admin_gate');
  if (error) return say('#loginMsg', error.message, true);
  if (g && g.verified) return enter();
  if (!g || !g.flag) return say('#loginMsg', 'This account is not an admin. Sign out and use the admin account.', true);
}
$('#sendLink').onclick = async () => {
  const email = $('#email').value.trim(); if (!email) return;
  const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin + location.pathname}});
  say('#loginMsg', error ? error.message : 'Check your email and open the link on this device.', !!error);
};
$('#gLogin').onclick = async () => {
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  if (error) say('#loginMsg', error.message, true);
};
$('#sendTg').onclick = async () => {
  const {error} = await sb.rpc('admin_otp_request');
  say('#loginMsg', error ? error.message : 'Code sent. Open Telegram and type the 6 digits here.', !!error);
};
$('#verifyMfa').onclick = async () => {
  const {data: ok, error} = await sb.rpc('admin_otp_verify', {p_code: $('#code').value.trim()});
  if (error) return say('#loginMsg', error.message, true);
  if (!ok) return say('#loginMsg', 'Wrong code. Try again, or ask for a new one.', true);
  enter();
};
$('#tgOut').onclick = async () => { try { await sb.auth.signOut(); } catch (e) {} location.href = location.pathname; };
$('#out').onclick = async () => { if (!DEMO) { try { await sb.rpc('admin_sign_out'); } catch (e) {} await sb.auth.signOut(); } location.href = location.pathname; };
function say(sel, text, err) { $(sel).innerHTML = '<div class="msg ' + (err ? 'err' : 'okk') + '">' + esc(text) + '</div>'; }

// ---------- data ----------
async function call(fn, args) {
  const {data: d, error} = await sb.rpc(fn, args || {});
  if (error) { toast(error.message, true); throw error; }
  return d;
}
function toast(text, err) { const t = document.createElement('div'); t.className = 'msg ' + (err ? 'err' : 'okk'); t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;min-width:240px'; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
async function load() {
  const [licenses, orders, customers, config, audit] = await Promise.all(['admin_licenses', 'admin_orders', 'admin_customers', 'admin_config', 'admin_audit'].map(f => call(f)));
  Object.assign(data, {licenses, orders, customers, config, audit});
  const p = await sb.from('plans').select('*').order('sort'); data.plans = p.data || [];
  const v = await sb.from('videos').select('*').order('sort'); data.videos = (v && v.data) || [];
}
async function enter() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  const {data: {session}} = await sb.auth.getSession(); $('#who').textContent = session?.user?.email || '';
  try { await load(); } catch (e) { $('#view').innerHTML = '<div class="msg err">Not allowed: this account is not an admin, or the Telegram code step is missing. ' + esc(e.message || '') + '</div>'; return; }
  render();
}


// ---------- full customer account view: the live customer page is shown in a frame and fed this customer's data, read with the admin's own login ----------
const SITE_LIVE = 'https://yeliasforex.github.io/';
async function accountView(id) {
  const l = data.licenses.find(x => x.id === id); if (!l) return;
  $('#acv').classList.remove('hide'); $('#acvt').textContent = 'Account view: ' + (l.owner_email || 'no owner') + ' · ' + l.key + ' (read-only, as the customer sees it)';
  const f = $('#acvf'), c = data.customers.find(x => x.email === l.owner_email);
  let status = null, trades = [], catalog = [];
  try {
    const st = await sb.from('license_status').select('*').eq('license_id', id).maybeSingle(); status = st.data;
    for (let from = 0; from < 20000; from += 1000) { const r = await sb.from('trades').select('engine,dir,is_add,opened_at,closed_at,open_price,close_price,lots,result_r,profit').eq('license_id', id).order('closed_at').range(from, from + 999); if (r.error) throw r.error; trades = trades.concat(r.data); if (r.data.length < 1000) break; }
    const cat = await sb.from('message_catalog').select('*'); catalog = cat.data || [];
  } catch (e) { toast('Could not read this customer: ' + (e.message || e), true); }
  const cf = data.config || {}, orders = data.orders.filter(o => o.license_key === l.key || (l.owner_email && o.email === l.owner_email));
  const payload = {gteAdminView: true, trades, S: {

  ${data.plans.map(p => `<tr data-p="${p.id}"><td><input class="n" value="${esc(p.name)}" style="width:130px"></td><td><input class="l" type="number" value="${p.limit_usd ?? ''}" style="width:120px"></td><td><input class="pr" type="number" value="${p.price_usd}" style="width:110px"></td><td><input class="po" type="checkbox" ${p.popular ? 'checked' : ''}></td><td><input class="ac" type="checkbox" ${p.active ? 'checked' : ''}></td><td><button class="b">Save</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><b>Payment instructions (shown only to a signed-in customer with an order)</b>${fld('payment_network', 'Network and coin (shown to customers)')}${fld('payment_address', 'Wallet address (customers see it with a QR code)')}${fld('payment_instructions', 'Extra instructions', true)}${fld('payment_link', 'Optional payment link')}<div class="row" style="margin-top:10px"><button class="b pri" data-k="payment_network,payment_address,payment_instructions,payment_link">Save payment details</button></div></div>
  <div class="card"><b>General</b><label>Sales</label><select id="c_sales_open" style="width:100%"><option value="true" ${c.sales_open !== 'false' ? 'selected' : ''}>Open: customers can buy new licenses</option><option value="false" ${c.sales_open === 'false' ? 'selected' : ''}>Paused: new purchases blocked (renewals, upgrades and unbinds still work)</option></select>${fld('support_url', 'Support link (Telegram)')}${fld('aff_fusion_url', 'Fusion Markets affiliate link (https://...)')}${fld('aff_icmarkets_url', 'IC Markets affiliate link (https://...)')}${fld('latest_version', 'Latest EA version')}${fld('unbind_fee_usd', 'Unbind fee (USD)')}${fld('limit_tolerance_pct', 'Deposit tolerance over plan size (%)')}${fld('offline_minutes', 'Minutes without heartbeat = offline')}<div class="row" style="margin-top:10px"><button class="b pri" data-k="sales_open,support_url,aff_fusion_url,aff_icmarkets_url,latest_version,unbind_fee_usd,limit_tolerance_pct,offline_minutes">Save</button></div></div>
  <div class="card"><b>Backup</b><div class="mute">Downloads licenses, orders, trades and customers as JSON. Do this regularly on the free plan.</div><div class="row" style="margin-top:8px"><button class="b" id="exp">Download export</button></div></div>
  <div class="card"><b>EA release</b> <span class="mute">current version: ${esc(c.latest_version || '-')}</span>
    <div class="mute" style="margin:6px 0 10px">Upload the new customer file (GoldTriEngine.ex5 from build/customer). The Download page then serves it, every customer with an active license gets a notice in My account and a Telegram message, and their account page shows "new version available".</div>
    <label>New version number (for example 1.09)</label><input id="rv" placeholder="1.09" style="width:140px">
    <label>What changed (one or two lines, customers see this)</label><textarea id="rn" style="min-height:60px"></textarea>
    <label>File</label><input id="rf" type="file" accept=".ex5">
    <div class="row" style="margin-top:12px"><button class="b pri" id="rp">Publish release</button></div><div id="rm"></div></div>`;
  $('#view').querySelectorAll('tr[data-p] button').forEach(b => b.onclick = async () => {
    const r = b.closest('tr'), lim = r.querySelector('.l').value;
    await call('admin_update_plan', {p_id: r.dataset.p, p_name: r.querySelector('.n').value, p_limit: lim === '' ? null : +lim, p_price: +r.querySelector('.pr').value, p_popular: r.querySelector('.po').checked, p_active: r.querySelector('.ac').checked});
    toast('Plan saved'); await load();
  });
  $('#view').querySelectorAll('[data-k]').forEach(b => b.onclick = async () => { for (const k of b.dataset.k.split(',')) await call('admin_set_config', {p_key: k, p_value: $('#c_' + k).value}); toast('Saved'); await load(); });
  $('#rp').onclick = async () => {
    const ver = $('#rv').value.trim(), notes = $('#rn').value.trim(), f = $('#rf').files[0];
    if (!/^[0-9]+(\.[0-9]+){0,3}$/.test(ver)) return say('#rm', 'Type the version like 1.09.', true);
    if (!f || !/\.ex5$/i.test(f.name)) return say('#rm', 'Choose the GoldTriEngine.ex5 file.', true);
    if (f.size > 20e6) return say('#rm', 'The file is too big.', true);
    if (!confirm('Publish version ' + ver + '? The Download page switches to this file and all active customers are notified now.')) return;
    $('#rp').disabled = true; say('#rm', 'Uploading...', false);
    try {
      const path = 'v' + ver + '/GoldTriEngine.ex5';
      const up = await sb.storage.from('ea-releases').upload(path, f, {upsert: true, contentType: 'application/octet-stream'});
      if (up.error) throw up.error;
      const url = sb.storage.from('ea-releases').getPublicUrl(path).data.publicUrl;
      const r = await call('admin_publish_release', {p_version: ver, p_notes: notes, p_url: url});
      say('#rm', 'Published v' + r.version + '. ' + r.notified + ' customer(s) notified.', false); await load();
    } catch (e) { say('#rm', 'Failed: ' + (e.message || e), true); }
    $('#rp').disabled = false;
  };
  $('#exp').onclick = async () => { const j = await call('admin_export'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(j, null, 1)], {type: 'application/json'})); a.download = 'gte-export-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); };
}
function vVideos() {
  $('#view').innerHTML = `<div class="card"><b>Videos</b> <span class="mute">paste YouTube links; nothing is hosted here</span>
  <div class="row" style="margin-top:10px"><input id="vt" placeholder="Title" style="flex:1;min-width:160px"><input id="vu" placeholder="https://www.youtube.com/watch?v=..." style="flex:2;min-width:200px"><button class="b pri" id="va">Add</button></div>
  <div class="tblw"><table class="tbl">${data.videos.map(v => `<tr><td style="width:120px">${(m => m ? `<img class="th" loading="lazy" src="https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg" alt="">` : '')(String(v.url).match(/(?:v=|youtu\.be\/)([\w-]{11})/))}</td><td>${esc(v.title)}</td><td class="mono mute">${esc(v.url)}</td><td><button class="b dng" data-v="${v.id}">Remove</button></td></tr>`).join('') || '<tr><td class="mute">No videos yet. The website shows a clean placeholder.</td></tr>'}</table></div></div>`;
  $('#va').onclick = async () => { if (!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test($('#vu').value)) return toast('Use a YouTube link', true); await call('admin_video', {p_action: 'add', p_title: $('#vt').value, p_url: $('#vu').value}); await load(); vVideos(); };
  $('#view').querySelectorAll('[data-v]').forEach(b => b.onclick = async () => { await call('admin_video', {p_action: 'delete', p_id: +b.dataset.v}); await load(); vVideos(); });
}
function vAudit() {
  const q = (window._aq || '').toLowerCase(), A = data.audit.filter(a => !q || (a.action + JSON.stringify(a.detail || {})).toLowerCase().includes(q));
  const ac = a => /delete|disable|cancel|unbind|reject/.test(a) ? '#e5534b' : /create|assign|publish|confirm|enable/.test(a) ? '#3fb27f' : /save|set|update|extend|plan|allowance/.test(a) ? '#4f8ff7' : '#8b95a3';
  $('#view').innerHTML = `<div class="card"><div class="row"><input id="aq" placeholder="Search the log (action or details)" value="${esc(window._aq || '')}" style="flex:1"><span class="mute">${A.length} entries</span></div>
  <div class="tl">${A.map((a, i) => `<div class="te" style="--c:${ac(a.action)};animation-delay:${Math.min(i, 20) * 25}ms"><u></u><div><b>${esc(a.action)}</b> <span class="mute">${fmt(a.at)} · ${esc(String(a.actor).slice(0, 8))}</span><div class="mono mute" style="font-size:12px;word-break:break-all">${esc(JSON.stringify(a.detail || {}))}</div></div></div>`).join('') || '<div class="mute">Nothing matches.</div>'}</div></div>`;
  $('#aq').oninput = e => { window._aq = e.target.value; clearTimeout(window._t); window._t = setTimeout(() => { vAudit(); const i = $('#aq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200); };
}
start();
</script>
</body>
