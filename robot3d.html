<!doctype html><html><head><meta charset="utf-8"><title>GTE robot</title><style>

   line and a face display, white chest plate with the logo, black yoke and waist, white limbs with black pads) with a
   skeleton - arms move by IK, hands have fingers, legs walk, the display talks and shows emotions.
   The bot drives it through /state (voice loudness, scene, pose, effects). Test: /?pose=wave&scene=happy&talk=1 */

#r{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:35% 95%}
#gl,#fx{position:absolute;left:0;top:0;width:100vw;height:100vh}

 45%{transform:scaleX(.06) scaleY(1.08);filter:brightness(4);opacity:.5}55%,62%{transform:scaleX(0);opacity:0}
 80%{transform:scaleX(.5);filter:brightness(2.5);opacity:.8}100%{transform:none;filter:none;opacity:1}}
.p{position:absolute;font:900 4vh 'Segoe UI Emoji','Segoe UI',Arial,sans-serif;pointer-events:none;
 color:#ffd23f;text-shadow:0 .4vh 1vh rgba(0,0,0,.45);animation:rise 1.8s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1;transform:translateY(-3vh) scale(1.1)}
 100%{opacity:0;transform:translateY(-20vh) scale(1)}}

"use strict";

// ================================================================= math (column-major 4x4) ========================
const M = {
  id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) { const o = new Float32Array(16);

  S(x, y, z) { const m = M.id(); m[0] = x; m[5] = y; m[10] = z; return m; },
  RX(a) { const m = M.id(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
  RY(a) { const m = M.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
  RZ(a) { const m = M.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },

  chain(...ms) { return ms.reduce((a, b) => M.mul(a, b)); },

const FS = `precision highp float;

         + uGlowCol * fres * max(dot(N, L3) + .35, 0.) * .4
         + vec3(1., .6, .26) * pow(1. - max(dot(N, Vd), 0.), 2.6) * max(dot(N, normalize(vec3(.9, .1, -.5))) + .15, 0.) * .5        // warm orange rim from the right-back ...
         + vec3(.2, .8, 1.) * pow(1. - max(dot(N, Vd), 0.), 2.6) * max(dot(N, normalize(vec3(-.9, .15, -.5))) + .15, 0.) * .55       // ... cold teal rim from the left-back (cinema colour contrast)
         + pow(max(dot(N, normalize(L1 + Vd)), 0.), 260.) * uSpec * 1.1                                                          // a tight clear-coat highlight on top of the glossy paint

    n = mix(n, clamp(vW.y / 2.1, 0., 1.), .35);

function upload(pos, idx, uv) {

const sp = (x, p) => Math.sign(x) * Math.pow(Math.abs(x), p);
const MESH = {};
MESH.sphere = grid(28, 18, (u, v) => { const t = u * 6.2832, p = v * Math.PI; return [Math.sin(p) * Math.sin(t), Math.cos(p), Math.sin(p) * Math.cos(t)]; });

  return [sp(Math.sin(p), e) * sp(Math.sin(t), e), sp(Math.cos(p), e), sp(Math.sin(p), e) * sp(Math.cos(t), e)]; }); }
MESH.chest = grid(32, 24, (u, v) => { const t = u * 6.2832 - Math.PI, p = v * Math.PI, e = .42;   // sculpted chest
  let x = sp(Math.sin(p), e) * sp(Math.sin(t), e), y = sp(Math.cos(p), e), z = sp(Math.sin(p), e) * sp(Math.cos(t), e);
  const k = (y + 1) / 2; x *= .74 + .26 * k; z *= .86 + .14 * k;

  return [(R + r * Math.cos(p)) * Math.cos(t), r * Math.sin(p), (R + r * Math.cos(p)) * Math.sin(t)]; });

function capsule(r1, r2, len) {            // tapered capsule from y=0 down to y=-len (limbs, fingers)

// the head: a smooth humanoid helmet (egg-shaped, narrow chin, flat face area) - a glossy black display in front
function headShape(t, p) {

async function poll() {

}

const MOUTHS = [[1 / 3, "b"], [2 / 3, "c"], [1, "d"]];   // mouth openings for the lip-synced Shorts
async function snapAll() {
  for (const [pose, sc, tn, alias] of SNAPS) {
    poseName = pose; scene = sc; tint = tn;
    for (let i = 0; i < 120; i++) { simNow += 33; frame(simNow); }     // 4 s of animation, run straight through
    await new Promise(r => setTimeout(r, 50));

    for (const [open, letter] of MOUTHS) {       // the same body, only the mouth opens (time stands still: dt = 0)
      snapOpen = open; frame(simNow);
